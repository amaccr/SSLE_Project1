# Instances per site, built in this order (db before the apps that use it, lb after its backends).
# <site> <instance> <role> <host> [owner]
#   role  = which provision_<role> function in scripts/build.sh sets it up
#   host  = last octet of its FIXED address in the site subnet (.2-.99 are fixed, .100-.254 are DHCP).
#           Fixed because the firewall rules are written with IPs (Incus bridge ACLs can't match by name).
#   owner = user.owner, only where it differs from the zone's default owner (docs/naming.md)
# Plan per site: lb .10, api .21-.29, analytics .31, db .41, prom .51
avr  db-01   db   41  team-data
avr  api-01  api  21  team-web
avr  api-02  api  22
avr  lb-01   lb   10
# Site 2 (scalability + bandwidth-optimisation bonus): self-contained, with its own db and a LOCAL
# Prometheus that the central prom-01.ssle federates (docs/architecture.md "Uneven Prometheus, on purpose").
lis  db-01   db   41
lis  api-01  api  21
lis  prom-01 prom 51
# planned, not built yet:
# avr  analytics-01  analytics  31
