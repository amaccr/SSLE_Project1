<!-- Goes inside <ossec_config> in siem-01's /var/ossec/etc/ossec.conf (replaces the placeholder block).
     firewall-drop runs on the reporting agent (location=local => lb-01) and adds an iptables DROP for
     the attacker's srcip; timeout=600 auto-removes it after 10 minutes. -->
<active-response>
  <command>firewall-drop</command>
  <location>local</location>
  <rules_id>100101</rules_id>
  <timeout>600</timeout>
</active-response>
